<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #131016;
    --bg-raised: #1a1620;
    --bg-card: #1d1824;
    --line: #2c2534;
    --text: #ede8f2;
    --text-dim: #9a90a8;
    --text-faint: #675f74;
    --shawna: #b06bd6;
    --shawna-dim: #6b3d84;
    --mira: #5fae7a;
    --mira-dim: #3a6b4c;
    --accent: #e8c34a;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }
  ::selection{ background: var(--shawna-dim); color: #fff; }

  /* Header */
  header{
    position: sticky; top:0; z-index: 20;
    background: rgba(19,16,22,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 14px;
  }
  .header-top{
    display:flex; align-items:baseline; justify-content:space-between; gap: 12px;
  }
  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  h1 .index{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    color: var(--text-faint);
    display:block;
    margin-top: 2px;
    letter-spacing: 0.04em;
  }
  .count-tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  /* Filters */
  .filters{
    display:flex; gap: 8px; margin-top: 14px; overflow-x: auto;
    scrollbar-width: none; padding-bottom: 2px;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text-dim);
    white-space: nowrap;
    cursor: pointer;
    transition: all .15s ease;
    flex-shrink: 0;
  }
  .chip.active[data-c="all"]{ background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip.active[data-c="Shawna"]{ background: var(--shawna); color: #1a0e22; border-color: var(--shawna); }
  .chip.active[data-c="Mira"]{ background: var(--mira); color: #0e1f14; border-color: var(--mira); }

  .search-row{ margin-top: 10px; }
  .search-row input{
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .search-row input::placeholder{ color: var(--text-faint); }
  .search-row input:focus{ outline: none; border-color: var(--shawna-dim); }

  /* Gallery */
  main{ padding: 18px 16px 0; max-width: 900px; margin: 0 auto; }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media(min-width: 640px){
    .grid{ grid-template-columns: repeat(3, 1fr); gap: 14px; }
  }
  @media(min-width: 960px){
    .grid{ grid-template-columns: repeat(4, 1fr); }
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    border-left: 3px solid var(--line);
  }
  .card.Shawna{ border-left-color: var(--shawna); }
  .card.Mira{ border-left-color: var(--mira); }

  .card-media{
    position: relative;
    aspect-ratio: 9/16;
    background: var(--bg-raised);
  }
  .card-swipe{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    height:100%; width:100%; scrollbar-width:none;
  }
  .card-swipe::-webkit-scrollbar{ display:none; }
  .card-swipe img{
    flex:0 0 100%; width:100%; height:100%; object-fit:contain;
    scroll-snap-align:start; background: var(--bg-raised); display:block;
  }
  .img-count-badge{
    position:absolute; top:8px; right:8px; z-index:2;
    background: rgba(10,8,12,0.72); color:#fff;
    font-family:'JetBrains Mono', monospace; font-size: 10.5px;
    padding: 3px 7px; border-radius: 20px;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }

  .card-overlay{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding: 9px 10px;
    background: rgba(19,16,22,0.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:space-between; gap: 8px;
    cursor: pointer;
  }
  .card-overlay .info{ min-width:0; flex: 1; }
  .card-overlay .tag{ margin-bottom: 3px; }
  .copy-icon-btn{
    flex-shrink:0; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
    color:#fff; font-size: 14px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .copy-icon-btn.copied{ background: var(--accent); border-color: var(--accent); color:#1a1610; }

  .tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
    padding: 3px 7px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .tag.character.Shawna{ background: rgba(176,107,214,0.28); color: #ecd7fa; }
  .tag.character.Mira{ background: rgba(95,174,122,0.28); color: #d8f2e1; }
  .tag.platform{ background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--line); }

  .template-name{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;

    font-size: 13.5px;
    margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--text-faint);
    grid-column: 1 / -1;
  }
  .empty-state .glyph{ font-size: 32px; margin-bottom: 10px; }
  .empty-state p{ font-family: 'JetBrains Mono', monospace; font-size: 13px; }

  /* FAB */
  .fab{
    position: fixed; right: 20px; bottom: 24px; z-index: 30;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--shawna), var(--mira));
    border: none; color: #100c14;
    font-size: 26px; font-weight: 600;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(176,107,214,0.35);
    cursor:pointer;
  }
  .fab:active{ transform: scale(0.94); }

  /* Modal */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(10,8,12,0.7);
    backdrop-filter: blur(3px);
    z-index: 40; display:none;
    align-items: flex-end;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--bg-raised);
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--line);
    padding: 18px 18px 30px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp{ from{ transform: translateY(30px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;
  }
  .modal-header h2{
    font-family:'Space Grotesk', sans-serif; font-size: 18px; margin:0;
  }
  .modal-close{
    background:none; border:none; color: var(--text-dim); font-size: 22px; cursor:pointer; padding: 4px 8px;
  }
  label{
    display:block; font-family:'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em;
    margin: 16px 0 6px;
  }
  label:first-of-type{ margin-top: 0; }
  input[type=text], textarea, select{
    width:100%; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14.5px;
  }
  textarea{ resize: vertical; min-height: 90px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color: var(--shawna-dim); }
  select{ appearance: none; -webkit-appearance:none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a90a8' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position: right 12px center; }

  .char-toggle{ display:flex; gap:8px; }
  .char-toggle button{
    flex:1; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg-card); color: var(--text-dim); font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size: 14px; cursor:pointer;
  }
  .char-toggle button.sel[data-c="Shawna"]{ background: rgba(176,107,214,0.18); border-color: var(--shawna); color: var(--shawna); }
  .char-toggle button.sel[data-c="Mira"]{ background: rgba(95,174,122,0.18); border-color: var(--mira); color: var(--mira); }

  .file-drop{
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px;
    text-align:center; color: var(--text-faint); font-size: 13px; cursor:pointer;
    position: relative;
  }
  .file-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .file-drop.has-file{ border-style: solid; border-color: var(--mira-dim); color: var(--mira); }
  .preview-grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px;
  }
  .preview-grid img{
    width:100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px;
  }

  .submit-btn{
    width:100%; margin-top: 22px; padding: 14px; border-radius: 12px; border:none;
    background: var(--text); color: var(--bg); font-family:'Space Grotesk',sans-serif;
    font-weight: 700; font-size: 15px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity: 0.5; }
  .form-msg{ font-family:'JetBrains Mono', monospace; font-size: 12px; margin-top: 10px; text-align:center; min-height: 16px; }
  .form-msg.error{ color: #e06b6b; }
  .form-msg.ok{ color: var(--mira); }

  .auth-link{
    background:none; border:none; color: var(--text-faint);
    font-family:'JetBrains Mono', monospace; font-size: 11px;
    text-decoration: underline; cursor:pointer; padding: 2px 4px;
  }

  /* Detail popup (full-screen image viewer) */
  .detail-overlay{
    position: fixed; inset:0; z-index: 60; background:#000; display:none;
  }
  .detail-overlay.open{ display:block; }
  .detail-x{
    position:absolute; top:14px; right:14px; z-index:10;
    width:36px; height:36px; border-radius:50%;
    background: rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .detail-stage{
    position:absolute; inset:0; z-index:1; background:#000;
  }
  .detail-swipe{
    display:flex; width:100%; height:100%; overflow-x:auto;
    scroll-snap-type:x mandatory; scrollbar-width:none; touch-action: pan-x;
  }
  .detail-swipe::-webkit-scrollbar{ display:none; }
  .detail-swipe .slide{
    flex:0 0 100%; height:100%; scroll-snap-align:start;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-swipe img{
    max-width:100%; max-height:100%; object-fit:contain; display:block;
  }
  .detail-dots{
    position:absolute; top:16px; left:0; right:0; z-index:5;
    display:flex; justify-content:center; gap:5px; pointer-events:none;
  }
  .detail-dots .dot{ width:6px; height:6px; border-radius:50%; background: rgba(255,255,255,0.35); }
  .detail-dots .dot.active{ background:#fff; }

  .detail-scroll{
    position:absolute; inset:0; z-index:3; overflow-y:auto;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    scrollbar-width: none;
  }
  .detail-scroll::-webkit-scrollbar{ display:none; }
  .detail-spacer{ height: 58vh; pointer-events:none; }
  .detail-panel{
    min-height: 46vh;
    background: rgba(19,16,22,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px 20px 0 0;
    padding: 10px 18px 50px;
    pointer-events: auto;
  }
  .detail-handle{
    width: 36px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.25);
    margin: 6px auto 14px;
  }
  .detail-tags{ display:flex; gap:6px; margin-bottom: 10px; flex-wrap:wrap; }
  .detail-template{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 19px; margin: 0 0 12px;
    color: #fff;
  }
  .detail-label{
    font-family:'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.55);
    text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 6px;
  }
  .detail-label:first-of-type{ margin-top: 0; }
  .detail-prompt{
    font-size: 14px; line-height: 1.6; color: #fff; white-space: pre-wrap;
  }
  .detail-notes{ font-size: 13px; color: rgba(255,255,255,0.65); font-style: italic; }
  .btn-copy{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 14px;
    width: 100%;
  }
  .btn-copy:active{ background: rgba(255,255,255,0.22); }
  .btn-copy.copied{ background: var(--mira); border-color: var(--mira); color:#0e1f14; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Prompt Index<span class="index">Shawna & Mira / Template Archive</span></h1>
    <span class="count-tag" id="countTag">— entries</span>
  </div>
  <div id="authRow" style="margin-top:10px; display:none; justify-content:flex-end;">
    <button class="auth-link" id="authLink" onclick="handleAuthClick()">Sign out</button>
  </div>
  <div class="filters">
    <div class="chip active" data-c="all" onclick="setFilter('all')">All</div>
    <div class="chip" data-c="Shawna" onclick="setFilter('Shawna')">Shawna</div>
    <div class="chip" data-c="Mira" onclick="setFilter('Mira')">Mira</div>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search template, prompt, notes..." oninput="renderGrid()">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="glyph">◌</div>
    <p>NO ENTRIES YET — TAP + TO ADD ONE</p>
  </div>
</main>

<button class="fab" id="fabBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Sign in</h2>
      <button class="modal-close" onclick="closeLoginModal()">×</button>
    </div>
    <label>Email</label>
    <input type="text" id="login_email" autocapitalize="off" autocomplete="email">
    <label>Password</label>
    <input type="text" id="login_password" autocomplete="current-password" style="-webkit-text-security: disc;">
    <button class="submit-btn" onclick="doLogin()">Sign in</button>
    <div class="form-msg" id="loginMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>New entry</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    <label>Character</label>
    <div class="char-toggle">
      <button type="button" data-c="Shawna" onclick="selectChar('Shawna')">Shawna</button>
      <button type="button" data-c="Mira" onclick="selectChar('Mira')">Mira</button>
    </div>

    <label>Template name</label>
    <input type="text" id="f_template" placeholder="e.g. Poolside lounge chair">

    <label>Prompt text</label>
    <textarea id="f_prompt" placeholder="Paste the full locked prompt..."></textarea>

    <label>Platform</label>
    <select id="f_platform">
      <option value="Gemini">Gemini</option>
      <option value="Flow">Google Flow</option>
      <option value="Kling">Kling</option>
      <option value="ChatGPT">ChatGPT</option>
      <option value="Other">Other</option>
    </select>

    <label>Images <span style="text-transform:none; opacity:0.6;">(select multiple if you have several for this prompt)</span></label>
    <div class="file-drop" id="fileDrop">
      <span id="fileDropText">Tap to choose image(s)</span>
      <input type="file" id="f_image" accept="image/*" multiple>
    </div>
    <div class="preview-grid" id="previewGrid"></div>

    <label>Notes <span style="text-transform:none; opacity:0.6;">(optional — what worked / failed)</span></label>
    <textarea id="f_notes" style="min-height:60px;" placeholder="Optional notes..."></textarea>

    <button class="submit-btn" id="submitBtn" onclick="submitEntry()">Save entry</button>
    <div class="form-msg" id="formMsg"></div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <button class="detail-x" onclick="closeDetailModal()" aria-label="Close">×</button>
  <div class="detail-stage" id="detailStage"></div>
  <div class="detail-scroll" id="detailScroll">
    <div class="detail-spacer"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-handle"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://cxvinrcwagrherugqcoy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dmlucmN3YWdyaGVydWdxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Nzc5MDIsImV4cCI6MjEwMjA1MzkwMn0.ke5EVLpoOG4QxFSdlAZMe_9UkXauiXefbJfx1oyst7s";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let entries = [];
  let activeFilter = "all";
  let selectedChar = null;
  let selectedFiles = [];
  let currentSession = null;

  // ---- Auth ----
  async function initAuth(){
    const { data: { session } } = await sb.auth.getSession();
    updateAuthUI(session);
    sb.auth.onAuthStateChange((_event, session) => {
      updateAuthUI(session);
    });
  }

  function updateAuthUI(session){
    currentSession = session;
    const authRow = document.getElementById('authRow');
    if(session){
      authRow.style.display = 'flex';
    }else{
      authRow.style.display = 'none';
    }
  }

  function handleAuthClick(){
    if(currentSession){
      sb.auth.signOut();
    }else{
      openLoginModal();
    }
  }

  function openLoginModal(){
    document.getElementById('loginOverlay').classList.add('open');
  }
  function closeLoginModal(){
    document.getElementById('loginOverlay').classList.remove('open');
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('loginMsg').className = 'form-msg';
  }

  async function doLogin(){
    const email = document.getElementById('login_email').value.trim();
    const password = document.getElementById('login_password').value;
    const msg = document.getElementById('loginMsg');
    if(!email || !password){ msg.textContent = 'Enter email and password.'; msg.className = 'form-msg error'; return; }
    msg.textContent = 'Signing in...';
    msg.className = 'form-msg';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      msg.textContent = error.message;
      msg.className = 'form-msg error';
    }else{
      msg.textContent = 'Signed in ✓';
      msg.className = 'form-msg ok';
      setTimeout(closeLoginModal, 500);
    }
  }

  async function loadEntries(){
    const { data, error } = await sb.from('prompts').select('*').order('created_at', { ascending: false });
    if(error){ console.error(error); return; }
    entries = data || [];
    renderGrid();
  }

  function setFilter(c){
    activeFilter = c;
    document.querySelectorAll('.chip').forEach(el => el.classList.toggle('active', el.dataset.c === c));
    renderGrid();
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const empty = document.getElementById('emptyState');
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

    let filtered = entries.filter(e => activeFilter === 'all' || e.character === activeFilter);
    if(q){
      filtered = filtered.filter(e =>
        (e.template_name||'').toLowerCase().includes(q) ||
        (e.prompt_text||'').toLowerCase().includes(q) ||
        (e.notes||'').toLowerCase().includes(q)
      );
    }

    document.getElementById('countTag').textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');

    if(filtered.length === 0){
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = filtered.map(e => {
      const urls = getImageUrls(e);
      const isMulti = urls.length > 1;
      return `
      <div class="card ${e.character}">
        <div class="card-media" onclick="openDetail('${e.id}')">
          <div class="card-swipe">
            ${urls.map(u => `<img src="${u}" loading="lazy" alt="${escapeHtml(e.template_name||'')}">`).join('')}
          </div>
          ${isMulti ? `<span class="img-count-badge">${urls.length}</span>` : ''}
          <div class="card-overlay">
            <div class="info">
              <span class="tag character ${e.character}">${e.character}</span>
              <p class="template-name">${escapeHtml(e.template_name || 'Untitled')}</p>
            </div>
            <button class="copy-icon-btn" onclick="event.stopPropagation(); copyPromptQuick(this, '${e.id}')" aria-label="Copy prompt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function getImageUrls(e){
    if(!e.image_url) return [];
    return e.image_url.split(',').map(u => u.trim()).filter(Boolean);
  }

  function copyPrompt(btn, text){
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    });
  }

  function copyPromptQuick(btn, id){
    const e = entries.find(en => String(en.id) === String(id));
    if(!e) return;
    navigator.clipboard.writeText(e.prompt_text || '').then(() => {
      btn.classList.add('copied');
      setTimeout(() => { btn.classList.remove('copied'); }, 1200);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Detail popup
  function openDetail(id){
    const e = entries.find(en => String(en.id) === String(id));
    if(!e) return;
    const urls = getImageUrls(e);
    const isMulti = urls.length > 1;

    const stage = document.getElementById('detailStage');
    stage.innerHTML = `
      <div class="detail-swipe">
        ${urls.map(u => `<div class="slide"><img src="${u}" alt="${escapeHtml(e.template_name||'')}"></div>`).join('')}
      </div>
      ${isMulti ? `<div class="detail-dots">${urls.map((_,i) => `<span class="dot ${i===0?'active':''}"></span>`).join('')}</div>` : ''}
    `;

    if(isMulti){
      const swipe = stage.querySelector('.detail-swipe');
      const dots = stage.querySelectorAll('.detail-dots .dot');
      swipe.addEventListener('scroll', () => {
        const idx = Math.round(swipe.scrollLeft / swipe.clientWidth);
        dots.forEach((d,i) => d.classList.toggle('active', i === idx));
      });
    }

    const panel = document.getElementById('detailPanel');
    panel.innerHTML = `
      <div class="detail-handle"></div>
      <div class="detail-tags">
        <span class="tag character ${e.character}">${e.character}</span>
        <span class="tag platform">${e.platform||'—'}</span>
      </div>
      <p class="detail-template">${escapeHtml(e.template_name||'Untitled')}</p>
      <div class="detail-label">Prompt</div>
      <div class="detail-prompt">${escapeHtml(e.prompt_text||'')}</div>
      ${e.notes ? `<div class="detail-label">Notes</div><p class="detail-notes">${escapeHtml(e.notes)}</p>` : ''}
      <button class="btn-copy" onclick="copyPrompt(this, ${JSON.stringify(e.prompt_text||'').replace(/"/g,'&quot;')})">Copy prompt</button>
    `;

    document.getElementById('detailScroll').scrollTop = 0;
    document.getElementById('detailOverlay').classList.add('open');
  }
  function closeDetailModal(){
    document.getElementById('detailOverlay').classList.remove('open');
  }

  // Modal
  function openModal(){
    if(!currentSession){ openLoginModal(); return; }
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
    resetForm();
  }
  function selectChar(c){
    selectedChar = c;
    document.querySelectorAll('.char-toggle button').forEach(b => b.classList.toggle('sel', b.dataset.c === c));
  }

  document.getElementById('f_image').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    selectedFiles = files;
    document.getElementById('fileDrop').classList.add('has-file');
    document.getElementById('fileDropText').textContent = files.length === 1 ? files[0].name : `${files.length} images selected`;
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = '';
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = document.createElement('img');
        img.src = ev.target.result;
        grid.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  function resetForm(){
    selectedChar = null; selectedFiles = [];
    document.querySelectorAll('.char-toggle button').forEach(b => b.classList.remove('sel'));
    document.getElementById('f_template').value = '';
    document.getElementById('f_prompt').value = '';
    document.getElementById('f_notes').value = '';
    document.getElementById('f_platform').value = 'Gemini';
    document.getElementById('f_image').value = '';
    document.getElementById('fileDrop').classList.remove('has-file');
    document.getElementById('fileDropText').textContent = 'Tap to choose image(s)';
    document.getElementById('previewGrid').innerHTML = '';
    document.getElementById('formMsg').textContent = '';
    document.getElementById('formMsg').className = 'form-msg';
  }

  async function submitEntry(){
    const msg = document.getElementById('formMsg');
    const btn = document.getElementById('submitBtn');
    const template = document.getElementById('f_template').value.trim();
    const prompt = document.getElementById('f_prompt').value.trim();
    const platform = document.getElementById('f_platform').value;
    const notes = document.getElementById('f_notes').value.trim();

    if(!selectedChar){ msg.textContent = 'Pick a character.'; msg.className = 'form-msg error'; return; }
    if(!template || !prompt){ msg.textContent = 'Template name and prompt are required.'; msg.className = 'form-msg error'; return; }

    btn.disabled = true;

    let imageUrls = [];
    try{
      if(selectedFiles.length){
        for(let i = 0; i < selectedFiles.length; i++){
          msg.textContent = `Uploading image ${i+1} of ${selectedFiles.length}...`;
          msg.className = 'form-msg';
          const file = selectedFiles[i];
          const ext = file.name.split('.').pop();
          const path = `${selectedChar.toLowerCase()}/${Date.now()}-${i}.${ext}`;
          const { error: upErr } = await sb.storage.from('images').upload(path, file);
          if(upErr) throw upErr;
          const { data: pub } = sb.storage.from('images').getPublicUrl(path);
          imageUrls.push(pub.publicUrl);
        }
      }

      msg.textContent = 'Saving...';
      const { error: insErr } = await sb.from('prompts').insert({
        character: selectedChar,
        template_name: template,
        prompt_text: prompt,
        platform: platform,
        image_url: imageUrls.join(','),
        notes: notes || null
      });
      if(insErr) throw insErr;

      msg.textContent = 'Saved ✓';
      msg.className = 'form-msg ok';
      await loadEntries();
      setTimeout(closeModal, 600);
    }catch(err){
      console.error(err);
      msg.textContent = 'Error: ' + (err.message || 'something went wrong');
      msg.className = 'form-msg error';
    }finally{
      btn.disabled = false;
    }
  }

  initAuth();
  loadEntries();
</script>
</body>
</html>
